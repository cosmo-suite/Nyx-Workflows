# Velociraptor config for Nyx Gadget DM-only snapshot (z=2.0, 64 files)
# Adapted from examples/sample_dmcosmological_3dfof.cfg
# Adjust units below if your Nyx output uses different conventions.

Verbose=2

################################
# input options
################################
Input_includes_dm_particle=1
Input_includes_gas_particle=0
Input_includes_star_particle=0
Input_includes_bh_particle=0
Input_includes_wind_particle=0
Input_includes_tracer_particle=0
Input_includes_extradm_particle=0

# cosmological run
Cosmological_input=1

################################
# unit options (set to match your Gadget/Nyx units)
################################
Length_input_unit_conversion_to_output_unit=1.0
Velocity_input_unit_conversion_to_output_unit=1.0
Mass_input_unit_conversion_to_output_unit=1.0

Length_unit_to_kpc=1000.0
Velocity_to_kms=1.0
Mass_to_solarmass=1.0e10

# set to 1 if your positions are comoving (typical for Gadget/Nyx)
Comoving_units=1

MPI_particle_total_buf_size=100000000

################################
# search related options
################################
Particle_search_type=2
Baryon_searchflag=0
Search_for_substructure=0
Singlehalo_search=0
Keep_FOF=0

Minimum_size=20
Minimum_halo_size=35

FoF_Field_search_type=5
Halo_3D_linking_length=0.28

################################
# unbinding
################################
Unbind_flag=0

################################
# cosmology (overwritten by Gadget header if present)
################################
h_val=1.0
Omega_m=0.3
Omega_Lambda=0.7
Critical_density=1.0
Virial_density=200
Omega_b=0.

################################
# properties
################################
Inclusive_halo_masses=3
Iterate_cm_flag=0
Sort_by_binding_energy=1
Reference_frame_for_properties=2
Extensive_halo_properties_output=1

Calculate_aperture_quantities=1
Number_of_apertures=2
Aperture_values_in_kpc=10,100,
Number_of_projected_apertures=1
Projected_aperture_values_in_kpc=100,

Number_of_overdensities=5
Overdensity_values_in_critical_density=25,100,500,1000,2500,

Calculate_radial_profiles=1
Number_of_radial_profile_bin_edges=20
Radial_profile_norm=0
Radial_profile_bin_edges=-2.,-1.87379263,-1.74758526,-1.62137789,-1.49517052,-1.36896316,-1.24275579,-1.11654842,-0.99034105,-0.86413368,-0.73792631,-0.61171894,-0.48551157,-0.3593042,-0.23309684,-0.10688947,0.0193179,0.14552527,0.27173264,0.39794001,

################################
# output
################################
Write_group_array_file=0
Separate_output_files=0
Binary_output=2
Spherical_overdensity_halo_particle_list_output=1

# Snapshot index for temporally unique halo IDs
Snapshot_value=200

################################
# misc
################################
Verbose=0
